[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drmstep"
version = "0.1.0"
description = "Drawing -> render -> mesh -> STEP pipeline for cadgenbench"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matthew Bimrose" }]
dependencies = [
    "trimesh>=4.4",
    "Pillow>=10.0",
    "numpy>=1.26",
    "pydantic>=2.6",
    "typer>=0.12",
    "httpx>=0.27",
    "litellm>=1.40",
    "transformers>=4.46",
    "accelerate>=0.30",
    "huggingface_hub>=0.24",
    "PyYAML>=6.0",
    "rich>=13.7",
]

# torch/torchvision and cadquery live in third_party venvs (CADFit + Hunyuan3D-2)
# so the orchestrator stays light. drmstep installs torch separately so we can
# pick a CUDA wheel that matches the local GPU (Blackwell needs cu126+).
# Install torch via:
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
# Then `pip install -e .` here.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.6",
]

[project.scripts]
drmstep = "drmstep.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
